# Example experiment config (not loaded yet).
# Copy this file per experiment and override only what differs from lab/configs/defaults.py.
#
# Intended later usage:
#   python -m lab.pipeline.basic_suite2p_walk /data/root --config lab/configs/my_exp.yaml

experiment: example_experiment
cell_type_by_channel:
  # Which PMT has which cell type *for this prep*. Change this when
  # fluorescent sensors move; temporal/Cellpose ops follow the cell type,
  # not the Chan letter. Microscope cube defaults are only the fallback.
  ChanA: neuron
  ChanB: astrocyte
  SUPPORT_ChanA: neuron
  SUPPORT_ChanB: astrocyte

acquisition:
  # Overridden at run time from Experiment.xml (LSM frameRate/averageNum,
  # pixelSizeUM). Do not hardcode fs or µm/px for a new FOV.
  fs: null
  um_per_px: null
  tau: 1.0
  nplanes: 1
  nchannels: 1

preprocess:
  # Not run in this repo. Stacks should arrive already assembled / optionally
  # defringed / denoised. method is recorded for provenance only.
  method: none   # none | defringe_upstream | support | ...

suite2p:
  do_registration: true
  nonrigid: true
  spatial_scale: 0   # neuron default (auto). Astrocytes use temporal.astrocyte below.
  neucoeff: 0.7
  anatomical_only: 0   # 0 = functional detection; 1–4 = Cellpose on mean/max img

temporal:
  # Follows cell type, not ChanA/B. Physical units; converted via XML µm/px.
  # Lock FOV was 0.935 µm/px (Shinano LED_x15 Level3b).
  neuron:
    tau: 1.0          # seconds
    spatscale_um: null  # auto spatial_scale
  astrocyte:
    tau: 1.0
    spatscale_um: 5.61  # 6 px at 0.935 µm/px → nearest suite2p scale

anatomical:
  # Cellpose on mean (anatomical_only=2). Same XML conversion.
  neuron:
    model: cyto3
    diameter_um: null   # auto
    flow_threshold: 1.5
  astrocyte:
    model: cyto3
    diameter_um: 8.415  # 9 px at 0.935 µm/px
    flow_threshold: 0.4

registration:
  # Register the delivered movie. No FFT notch / defringe here.
  # 1Preg must stay false (high-pass keeps residual ~10 px PMT texture).
  align_filter: none   # none | lowpass
  lowpass_sigma: 4.0
  smooth_sigma: 3.0
  nonrigid: false
  share_shifts_across_channels: true
  align_channel: A   # neuron PMT: Shinano=A, Musashi (USER-PC)=B

cellpose:
  # Custom weights optional. Stock cyto3 + diameter_um is the locked AC arm.
  models:
    neuron: models/neuron
    astrocyte: models/astrocyte

roi_selection:
  ellipticity_threshold: 0.78
  components_threshold: 3

postprocess:
  stimulation_range: null   # [start_frame, end_frame], or omit to use n_frames lookup
